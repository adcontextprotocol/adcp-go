name: context-agent image

# Builds the cmd/context-agent OCI image for linux/amd64 and linux/arm64,
# pushes to ghcr.io/<owner>/<repo>/context-agent, and signs each pushed
# digest with cosign keyless (OIDC against Sigstore).
#
# Triggers:
#   - push to main           → tags: edge, main-<short_sha>
#   - push of context-agent-v* tag → tags: <semver>, <major>.<minor>, <major>, latest
#   - pull_request           → build only, no push (verifies Dockerfile stays green)
#   - workflow_dispatch      → manual rebuild
#
# Permissions:
#   - packages:  write  → push to GHCR
#   - id-token:  write  → cosign keyless signing
#
# First-push note: GHCR creates the package as private. After the first
# successful push, a repo admin must flip visibility to public via
# GitHub → Packages → context-agent → Package settings → Change visibility.

on:
  push:
    branches: [main]
    tags: ['context-agent-v*']
  pull_request:
    branches: [main]
    paths:
      - cmd/context-agent/**
      - targeting/**
      - tmproto/**
      - go.mod
      - go.sum
      - .github/workflows/context-agent-image.yml
  workflow_dispatch:

concurrency:
  group: context-agent-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/context-agent

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=match,pattern=context-agent-v(.*),group=1
            type=match,pattern=context-agent-v(\d+\.\d+),group=1
            type=match,pattern=context-agent-v(\d+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/context-agent-v') }}
          labels: |
            org.opencontainers.image.title=context-agent
            org.opencontainers.image.description=Production TMP context-match service
            org.opencontainers.image.vendor=Ad Context Protocol

      - name: Build & push
        id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: cmd/context-agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=context-agent
          cache-to: type=gha,mode=max,scope=context-agent
          provenance: mode=max
          sbom: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.0.6

      - name: Sign image (keyless OIDC)
        # Signs every pushed tag against the build's content digest, so all
        # tags that resolve to the same image share a single transparency-log
        # entry per digest. Verify with:
        #   cosign verify ghcr.io/<owner>/<repo>/context-agent:<tag> \
        #     --certificate-identity-regexp='https://github.com/<owner>/<repo>/.github/workflows/context-agent-image\.yml@.*' \
        #     --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            cosign sign --yes "${tag}@${DIGEST}"
          done
