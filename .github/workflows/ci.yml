name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ADCP_SDK_VERSION: "13.0.0-rc.26"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go-version: ["1.25", "1.26", "1.27"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Decide schema bundle trust mode
        id: schema-bundle
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            base_ref="$BEFORE_SHA"
          else
            git fetch --no-tags --depth=1 origin main
            base_ref="FETCH_HEAD"
          fi

          if git diff --quiet "$base_ref" -- adcp/schemas/VERSION adcp/schemas/.bundle-sha256 adcp/v3/schemas/VERSION adcp/v3/schemas/.bundle-sha256; then
            echo "trust-pinned-bundle=1" >> "$GITHUB_OUTPUT"
          else
            echo "Schema bundle pin changed; live Sigstore verification will run."
            echo "trust-pinned-bundle=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          # renovate: datasource=github-releases depName=sigstore/cosign versioning=semver
          cosign-release: v3.0.6

      - name: Download upstream schemas
        working-directory: adcp/schemas
        env:
          ADCP_TRUST_PINNED_BUNDLE: ${{ steps.schema-bundle.outputs.trust-pinned-bundle }}
        run: ./download.sh

      - name: Download upstream schemas (adcp/v3)
        working-directory: adcp/v3/schemas
        env:
          ADCP_TRUST_PINNED_BUNDLE: ${{ steps.schema-bundle.outputs.trust-pinned-bundle }}
        run: ./download.sh

      - name: Test schema generator
        working-directory: adcp/schemas
        run: python3 -m unittest discover -p '*_test.py'

      - name: Test schema generator (adcp/v3)
        working-directory: adcp/v3/schemas
        run: python3 -m unittest discover -p '*_test.py'

      - name: Check adcp/types_gen.go is up to date
        run: |
          (cd adcp/schemas && python3 generate.py > ../types_gen.go)
          git diff --exit-code adcp/types_gen.go

      - name: Check adcp/v3/types_gen.go is up to date
        run: |
          (cd adcp/v3/schemas && python3 generate.py > ../types_gen.go)
          git diff --exit-code adcp/v3/types_gen.go

      - name: Check hand-written types match schema
        working-directory: adcp/schemas
        run: python3 lint.py --strict

      - name: Check hand-written types match schema (adcp/v3)
        working-directory: adcp/v3/schemas
        run: python3 lint.py --strict

      - name: Check generated any coverage
        working-directory: adcp/schemas
        run: python3 generate.py --coverage-max-unreviewed-any 0

      - name: Check generated any coverage (adcp/v3)
        working-directory: adcp/v3/schemas
        run: python3 generate.py --coverage-max-unreviewed-any 0

      - name: Check generated code is up to date
        run: |
          (cd tmproto && go generate ./...)
          git diff --exit-code tmproto/types_gen.go

      - name: Test root module
        run: go test -race -count=1 ./...

      - name: Test tmproto module
        working-directory: tmproto
        run: go test -race -count=1 ./...

      - name: Test tmpclient module
        working-directory: tmpclient
        run: go test -race -count=1 ./...

      - name: Test adcp module
        working-directory: adcp
        run: go test -race -count=1 ./...

      - name: Test adcp/v3 module
        working-directory: adcp/v3
        run: go test -race -count=1 ./...

      - name: Test targeting module
        working-directory: targeting
        run: go test -race -count=1 ./...

      - name: Test context agent
        working-directory: reference/context-agent
        run: go test -race -count=1 ./...

      - name: Test seller agent
        working-directory: reference/seller-agent
        run: go test -race -count=1 ./...

      - name: Test hello-seller example
        working-directory: reference/hello-seller
        run: go test -race -count=1 ./...

      - name: Test e2e
        working-directory: e2e
        run: go test -race -count=1 ./...

      - name: Test bench module
        working-directory: bench
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify go.work.example includes all sub-modules
        run: bash scripts/check-goworkexample.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - name: Run golangci-lint (root)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          args: ./...

      - name: Run golangci-lint (context agent)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          working-directory: reference/context-agent
          args: ./...

      - name: Run golangci-lint (seller agent)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          working-directory: reference/seller-agent
          args: ./...

      - name: Run golangci-lint (hello-seller example)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          working-directory: reference/hello-seller
          args: ./...

      - name: Run golangci-lint (adcp/v3)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          working-directory: adcp/v3
          args: ./...

      - name: Run golangci-lint (targeting)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.11
          working-directory: targeting
          args: ./...

      # The containerized end-to-end stack's tooling. The stack itself runs in
      # the separate e2e-stack workflow, which only fires on paths that affect
      # it; linting here keeps the module honest on every change.
      - name: Run golangci-lint (e2e stack)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.13
          working-directory: e2e/stack
          args: ./...

  wba-interop:
    name: Web Bot Auth Interop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # adcontextprotocol/adcp commit whose tests/wba-interop/ harness and
      # wba-profile vectors grade this SDK: the head of adcp#8298. Move it to
      # the merge commit once that pull request merges.
      ADCP_REF: "306cdfa6e565725e1a122838eafbcc980707306b"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # The harness's package.json requires Node 24.
          node-version: "24"

      # The spec checkout goes under RUNNER_TEMP: ./adcp is this repository's
      # own module.
      - name: Check out the harness at ADCP_REF
        run: |
          spec="$RUNNER_TEMP/adcp-spec"
          git init -q "$spec"
          git -C "$spec" sparse-checkout set tests/wba-interop static/compliance/source/test-vectors/wba-profile
          git -C "$spec" fetch -q --depth 1 --filter=blob:none https://github.com/adcontextprotocol/adcp "$ADCP_REF"
          git -C "$spec" checkout -q FETCH_HEAD

      - name: Install the harness
        run: npm ci --ignore-scripts --prefix "$RUNNER_TEMP/adcp-spec/tests/wba-interop"

      - name: Build the adapter
        working-directory: adcp/v3
        run: go build -o "$RUNNER_TEMP/wbainterop" ./signing/internal/wbainterop

      - name: Run the harness
        run: |
          node "$RUNNER_TEMP/adcp-spec/tests/wba-interop/run.mjs" \
            --adapter "$RUNNER_TEMP/wbainterop" \
            --vectors "$RUNNER_TEMP/adcp-spec/static/compliance/source/test-vectors/wba-profile" \
            --junit wba-interop.xml

      - name: Upload interop results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wba-interop
          if-no-files-found: ignore
          path: wba-interop.xml

  storyboard:
    name: Reference Seller Storyboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Run reference seller storyboard harness
        env:
          ADCP_PORT: "3003"
          STORYBOARD_RESULT_PATH: storyboard-result-go.json
          SELLER_LOG_PATH: storyboard-seller-go.log
        run: ./scripts/ci/run_storyboard_reference_seller.sh

      - name: Upload storyboard artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-reference-seller-storyboard
          if-no-files-found: ignore
          path: |
            storyboard-result-go.json
            storyboard-seller-go.log
