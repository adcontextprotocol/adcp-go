# docker-compose stack for identity-agent perf benchmarking.
#
# Services:
#   audience-valkey / fcap-valkey — the two Valkey backends the identity-agent
#     reads at request time.
#   configserver — mock CONFIG_SOURCE_URL that serves a synthetic package snapshot.
#   seeder — one-shot; populates the Valkey stores. Runs on `docker compose run seeder`.
#   identity-agent — the SUT. CPU/memory caps read from env vars so the runner
#     can sweep configurations.
#   loadgen — one-shot; drives load. Runs on `docker compose run loadgen`.
#
# Networks are isolated to the compose bridge; nothing binds to the host by
# default. Set HOST_METRICS_PORT to expose /metrics for external Prometheus
# scraping (optional).
services:
  audience-valkey:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30

  fcap-valkey:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30

  configserver:
    build:
      context: ../..
      dockerfile: bench/perf/Dockerfile
    image: adcp-perf-tools:latest
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/configserver"]
    environment:
      PORT: "9001"
      SELLER_AGENT_URL: "${SELLER_AGENT_URL:-https://seller.perf.local/agent}"
      TOTAL_PACKAGES: "${TOTAL_PACKAGES:-200}"
      AUDIENCE_PACKAGES: "${AUDIENCE_PACKAGES:-100}"
      AUDIENCES_PER_PACKAGE: "${AUDIENCES_PER_PACKAGE:-3}"
      TOTAL_AUDIENCES: "${TOTAL_AUDIENCES:-500}"
      AUTH_TOKEN: "${CONFIG_AUTH_TOKEN:-perf-bench-token}"
    restart: unless-stopped

  seeder:
    image: adcp-perf-tools:latest
    build:
      context: ../..
      dockerfile: bench/perf/Dockerfile
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/seeder"]
    environment:
      # Seeder honors the same *_VALKEY_{MODE,SHARDS} contract identity-agent
      # reads through, so writes fan out across shards via the exact same
      # routing (standalone / cluster / shadow-CRC16).
      AUDIENCE_VALKEY_MODE: "${AUDIENCE_VALKEY_MODE:-standalone}"
      AUDIENCE_VALKEY_SHARDS: '${AUDIENCE_VALKEY_SHARDS:-{"0":"audience-valkey:6379"}}'
      FCAP_VALKEY_MODE: "${FCAP_VALKEY_MODE:-standalone}"
      FCAP_VALKEY_SHARDS: '${FCAP_VALKEY_SHARDS:-{"0":"fcap-valkey:6379"}}'
      SELLER_AGENT_URL: "${SELLER_AGENT_URL:-https://seller.perf.local/agent}"
      TOTAL_USERS: "${TOTAL_USERS:-100000}"
      TOTAL_AUDIENCES: "${TOTAL_AUDIENCES:-500}"
      AUDIENCES_PER_USER: "${AUDIENCES_PER_USER:-5}"
      TOTAL_PACKAGES: "${TOTAL_PACKAGES:-200}"
      FCAP_USER_FRACTION: "${FCAP_USER_FRACTION:-0.5}"
      PACKAGES_CAPPED_PER_USER: "${PACKAGES_CAPPED_PER_USER:-10}"

  identity-agent:
    build:
      context: ../..
      dockerfile: cmd/identity-agent/Dockerfile
    image: adcp-identity-agent:latest
    restart: unless-stopped
    depends_on:
      audience-valkey:
        condition: service_healthy
      fcap-valkey:
        condition: service_healthy
      configserver:
        condition: service_started
    # CPU/memory caps — set by run.sh via IDENTITY_CPUS / IDENTITY_MEMORY.
    # Uses top-level `cpus` and `mem_limit` (Compose v2 non-swarm honors
    # these directly; `deploy.resources` is unreliable outside swarm on
    # cgroup v2 hosts). run.sh additionally calls `docker update` and
    # verifies HostConfig.NanoCpus / HostConfig.Memory as belt-and-braces.
    cpus: "${IDENTITY_CPUS:-2}"
    mem_limit: "${IDENTITY_MEMORY:-2g}"
    memswap_limit: "${IDENTITY_MEMORY:-2g}"
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: "warn"
      REQUEST_TIMEOUT: "40ms"
      HTTP_READ_HEADER_TIMEOUT: "200ms"
      HTTP_READ_TIMEOUT: "500ms"
      HTTP_WRITE_TIMEOUT: "1s"
      HTTP_IDLE_TIMEOUT: "30s"
      MAX_OPEN_CONNECTIONS: "${MAX_OPEN_CONNECTIONS:-4096}"
      RESPONSE_TTL: "60s"
      STRICT_CONTENT_TYPE: "true"
      ACCESS_LOG_ENABLED: "false"
      SUPPORTED_ADCP_MAJOR_VERSIONS: "3"
      # No TMP signature verification for the benchmark.
      TMP_ALLOW_UNSIGNED: "true"
      TMP_OWN_ENDPOINT_URL: "http://identity-agent:8080/identity"
      # Config source — the mock serves the whole seller/package set.
      CONFIG_SOURCE_URL: "http://configserver:9001/v1/identity-configs"
      CONFIG_SOURCE_TOKEN: "${CONFIG_AUTH_TOKEN:-perf-bench-token}"
      CONFIG_SOURCE_TIMEOUT: "30s"
      CONFIG_REFRESH_INTERVAL: "5m"
      CONFIG_START_MODE: "retry"
      CONFIG_START_RETRY_DEADLINE: "1m"
      # Frequency-cap Valkey. MODE + SHARDS come from the runner so the same
      # image can drive standalone (1 shard), cluster (Redis Cluster protocol),
      # or shadow (client-side CRC16 hashing across N standalones).
      FCAP_VALKEY_MODE: "${FCAP_VALKEY_MODE:-standalone}"
      FCAP_VALKEY_SHARDS: '${FCAP_VALKEY_SHARDS:-{"0":"fcap-valkey:6379"}}'
      FCAP_VALKEY_DB: "0"
      FCAP_VALKEY_DIAL_TIMEOUT: "5s"
      FCAP_VALKEY_READ_TIMEOUT: "20ms"
      FCAP_VALKEY_POOL_SIZE: "${VALKEY_POOL_SIZE:-64}"
      FCAP_TIMEOUT: "15ms"
      # Audience Valkey — same MODE + SHARDS contract as fcap.
      AUDIENCE_VALKEY_MODE: "${AUDIENCE_VALKEY_MODE:-standalone}"
      AUDIENCE_VALKEY_SHARDS: '${AUDIENCE_VALKEY_SHARDS:-{"0":"audience-valkey:6379"}}'
      AUDIENCE_VALKEY_DB: "0"
      AUDIENCE_VALKEY_DIAL_TIMEOUT: "5s"
      AUDIENCE_VALKEY_READ_TIMEOUT: "20ms"
      AUDIENCE_VALKEY_POOL_SIZE: "${VALKEY_POOL_SIZE:-64}"
      AUDIENCE_TIMEOUT: "15ms"
      METRICS_ENABLED: "true"
      METRICS_NAMESPACE: "identity_agent"
      PPROF_ENABLED: "true"
    ports:
      - "${HOST_METRICS_PORT:-9464}:8080"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  writer:
    image: adcp-perf-tools:latest
    build:
      context: ../..
      dockerfile: bench/perf/Dockerfile
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/writer"]
    environment:
      AUDIENCE_VALKEY_MODE: "${AUDIENCE_VALKEY_MODE:-standalone}"
      AUDIENCE_VALKEY_SHARDS: '${AUDIENCE_VALKEY_SHARDS:-{"0":"audience-valkey:6379"}}'
      FCAP_VALKEY_MODE: "${FCAP_VALKEY_MODE:-standalone}"
      FCAP_VALKEY_SHARDS: '${FCAP_VALKEY_SHARDS:-{"0":"fcap-valkey:6379"}}'
      SELLER_AGENT_URL: "${SELLER_AGENT_URL:-https://seller.perf.local/agent}"
      TOTAL_USERS: "${TOTAL_USERS:-100000}"
      TOTAL_PACKAGES: "${TOTAL_PACKAGES:-200}"
      TOTAL_AUDIENCES: "${TOTAL_AUDIENCES:-500}"
      WRITE_QPS_FCAP: "${WRITE_QPS_FCAP:-0}"
      WRITE_QPS_AUDIENCE: "${WRITE_QPS_AUDIENCE:-0}"
      PACKAGES_PER_WRITE: "${PACKAGES_PER_WRITE:-2}"
      AUDIENCES_PER_WRITE: "${AUDIENCES_PER_WRITE:-1}"
      SERVE_WINDOW: "${SERVE_WINDOW:-60s}"
      # Writer keeps running until stopped; run-scaling.sh launches it in the
      # background and kills it after the loadgen step.
      DURATION: "${WRITER_DURATION:-5m}"

  loadgen:
    image: adcp-perf-tools:latest
    build:
      context: ../..
      dockerfile: bench/perf/Dockerfile
    entrypoint: ["/sbin/tini", "--", "/usr/local/bin/loadgen"]
    environment:
      TARGET: "http://identity-agent:8080/identity"
      SELLER_AGENT_URL: "${SELLER_AGENT_URL:-https://seller.perf.local/agent}"
      TOTAL_USERS: "${TOTAL_USERS:-100000}"
      TOTAL_PACKAGES: "${TOTAL_PACKAGES:-200}"
      PACKAGES_PER_REQ: "${PACKAGES_PER_REQ:-20}"
      IDENTITIES_PER_REQ: "${IDENTITIES_PER_REQ:-1}"
      QPS: "${QPS:-1000}"
      CONCURRENCY: "${CONCURRENCY:-128}"
      DURATION: "${DURATION:-30s}"
      WARMUP: "${WARMUP:-5s}"
      REPORT: "${REPORT:-/results/report.json}"
      LABEL: "${LABEL:-}"
    volumes:
      - ${RESULTS_DIR:-./results}:/results
    depends_on:
      - identity-agent

  # ------------------------------------------------------------------
  # Multi-shard shadow-mode nodes (extra standalone Valkeys). Combined
  # with the baseline fcap-valkey / audience-valkey (which stay shard 0),
  # these become shards 1..N-1 under `FCAP_VALKEY_MODE=shadow` etc. Only
  # start when the runner is testing shadow topologies.
  # ------------------------------------------------------------------
  fcap-valkey-2:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  fcap-valkey-3:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  fcap-valkey-4:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  audience-valkey-2:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  audience-valkey-3:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  audience-valkey-4:
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", ""]
    profiles: [shadow]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}

  # ------------------------------------------------------------------
  # Cluster-mode nodes. Each runs valkey-server with --cluster-enabled;
  # run-scaling.sh forms the cluster with `valkey-cli --cluster create`
  # after they're up. Isolated from the shadow shards so cluster and
  # shadow tests don't interfere.
  # ------------------------------------------------------------------
  fcap-cluster-1: &fcap_cluster
    image: valkey/valkey:8.0-alpine
    command: [
      "valkey-server", "--cluster-enabled", "yes", "--cluster-node-timeout", "5000",
      "--appendonly", "no", "--save", "", "--maxmemory-policy", "allkeys-lru",
      "--cluster-config-file", "/tmp/nodes.conf"
    ]
    profiles: [cluster]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  fcap-cluster-2:
    <<: *fcap_cluster
  fcap-cluster-3:
    <<: *fcap_cluster
  fcap-cluster-4:
    <<: *fcap_cluster
    profiles: [cluster-large]
  fcap-cluster-5:
    <<: *fcap_cluster
    profiles: [cluster-large]
  fcap-cluster-6:
    <<: *fcap_cluster
    profiles: [cluster-large]

  audience-cluster-1: &audience_cluster
    image: valkey/valkey:8.0-alpine
    command: [
      "valkey-server", "--cluster-enabled", "yes", "--cluster-node-timeout", "5000",
      "--appendonly", "no", "--save", "", "--maxmemory-policy", "allkeys-lru",
      "--cluster-config-file", "/tmp/nodes.conf"
    ]
    profiles: [cluster]
    healthcheck: {test: ["CMD", "valkey-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  audience-cluster-2:
    <<: *audience_cluster
  audience-cluster-3:
    <<: *audience_cluster
  audience-cluster-4:
    <<: *audience_cluster
    profiles: [cluster-large]
  audience-cluster-5:
    <<: *audience_cluster
    profiles: [cluster-large]
  audience-cluster-6:
    <<: *audience_cluster
    profiles: [cluster-large]
